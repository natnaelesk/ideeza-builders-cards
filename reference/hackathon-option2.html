<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>IDEEZA Virtual Hackathon — Option 2</title>
<link rel="stylesheet" href="fonts.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #120726; }
  body {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-family: Poppins, sans-serif;
    color: #fff;
  }
  #card {
    width: 1080px; height: 1350px;
    position: relative; overflow: hidden;
    background:
      radial-gradient(900px 700px at 110% -5%, #6a2ff0aa 0%, #6a2ff000 58%),
      radial-gradient(700px 600px at -10% 70%, #4b17c9aa 0%, #4b17c900 60%),
      radial-gradient(800px 500px at 70% 110%, #8b45ff66 0%, #8b45ff00 60%),
      linear-gradient(180deg, #1a0a3e 0%, #120726 48%, #0d061f 100%);
  }

  .bg { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .sphere {
    position: absolute; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #fff 0%, #e4d6ff 16%, #a77cff 50%, #6a2fe0 82%, #4b18b8 100%);
    box-shadow: inset -18px -22px 40px #3c0a9673, inset 14px 16px 30px #ffffff8c, 0 30px 80px #6e3cdc80;
    opacity: .85;
  }
  .sphere.glass {
    background: radial-gradient(circle at 30% 26%, #fffffff2 0%, #dcc8ff8c 22%, #9664ff59 60%, #6e3ce68c 100%);
    box-shadow: inset -10px -14px 30px #5a28c859, inset 10px 10px 24px #ffffffb3, 0 20px 60px #7846e666;
  }
  .s1 { width: 220px; height: 220px; top: 980px; left: -80px; opacity: .7; }
  .s2 { width: 72px; height: 72px; top: 200px; right: 280px; }
  .s3 { width: 180px; height: 180px; top: 620px; right: -70px; }
  .s4 { width: 36px; height: 36px; top: 430px; left: 520px; }

  /* faint square grid, very subtle */
  .grid {
    position: absolute; inset: 0; opacity: .12;
    background-image:
      linear-gradient(#6a2ff0 1px, transparent 1px),
      linear-gradient(90deg, #6a2ff0 1px, transparent 1px);
    background-size: 54px 54px;
    mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 70%);
    -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 0%, transparent 70%);
  }

  .logo { position: absolute; left: 64px; top: 52px; z-index: 2; }
  .logo img { height: 72px; width: auto; display: block; }

  .pill {
    position: absolute; top: 64px; right: 64px; z-index: 2;
    color: #fff;
    background: linear-gradient(135deg, #2a1170, #6a2ff0);
    border: 1px solid #ffffff2a;
    border-radius: 999px;
    display: inline-flex; align-items: center; gap: 12px;
    font-weight: 700; font-size: 18px; letter-spacing: 2.6px;
    padding: 12px 22px;
    box-shadow: 0 12px 30px #5a28dc59, inset 0 1px #ffffff40;
    white-space: nowrap;
  }
  .pill-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #b9ff6a;
    box-shadow: 0 0 0 5px #b9ff6a40, 0 0 14px #b9ff6a;
  }

  .hero { position: absolute; left: 64px; top: 165px; width: 952px; z-index: 2; }
  .eyebrow {
    font-size: 16px; font-weight: 600; letter-spacing: 6px;
    color: #c6a8ff; text-transform: uppercase;
    display: flex; align-items: center; gap: 14px;
  }
  .eyebrow .sq { width: 10px; height: 10px; background: #6a2ff0; border-radius: 2px; flex: none; box-shadow: 0 0 16px #8b45ffaa; }
  .prize {
    margin-top: 6px;
    font-size: 128px; font-weight: 900; letter-spacing: -7px;
    line-height: .9; color: #fff;
    text-shadow: 0 20px 60px #6a2ff066;
  }
  .prize-sub {
    margin-top: 14px;
    font-size: 24px; font-weight: 400; color: #c6a8ff;
    letter-spacing: .2px;
  }
  .prize-sub b { font-weight: 600; color: #fff; }

  .headline { position: absolute; left: 64px; top: 400px; width: 952px; z-index: 2; }
  .h-thin {
    font-size: 92px; font-weight: 200; letter-spacing: -3px;
    line-height: .95; color: #efe8ff; opacity: .92;
  }
  .h-heavy {
    font-size: 92px; font-weight: 900; letter-spacing: -4px;
    line-height: .95; color: #fff;
    margin-top: -6px;
  }
  .h-sub {
    margin-top: 16px;
    font-size: 28px; font-weight: 400; color: #c6a8ff;
  }

  .photo {
    position: absolute; left: 64px; top: 630px; width: 420px; height: 420px; z-index: 3;
    border-radius: 50%;
    background: linear-gradient(#3a1d7a 0%, #5b28d6 100%);
    box-shadow:
      0 0 0 6px #ffffff22,
      0 0 0 14px #6a2ff055,
      0 30px 80px #6a2ff066,
      inset 0 0 0 2px #ffffff33;
    overflow: hidden;
  }
  .photo-ph {
    position: absolute; inset: 16px;
    border-radius: 50%;
    border: 2.5px dashed #c6a8ff80;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    overflow: hidden;
  }
  .photo-lbl {
    position: absolute; top: 78px; left: 0; right: 0;
    text-align: center; z-index: 1;
    font-size: 16px; font-weight: 700; letter-spacing: 3.5px; color: #efe8ff;
  }
  .photo-lbl small {
    display: block; margin-top: 4px;
    font-size: 13px; font-weight: 500; letter-spacing: .8px; color: #c6a8ffcc;
  }
  .sil { width: 78%; height: auto; display: block; margin-top: auto; }

  .info { position: absolute; left: 530px; top: 660px; width: 486px; z-index: 3; }
  .name {
    font-size: 48px; font-weight: 800; letter-spacing: -1px;
    color: #c7a9ff; line-height: 1.05;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .proj {
    margin-top: 8px;
    font-size: 22px; font-weight: 400; color: #a98bf0;
    line-height: 1.3;
    max-height: 58px; overflow: hidden;
  }
  .rule {
    width: 72px; height: 3px; background: #6a2ff0; border-radius: 2px;
    margin: 22px 0 24px;
    box-shadow: 0 0 16px #8b45ffaa;
  }
  .meta {
    font-size: 20px; font-weight: 500; color: #d4c4ff; line-height: 1.55;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
  .chip {
    background: #ffffff14;
    border: 1px solid #ffffff28;
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 16px; font-weight: 600; color: #efe8ff;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    white-space: nowrap;
  }

  .info-qr {
    display: flex; align-items: center; gap: 18px;
    margin-top: 28px;
  }
  .footer {
    position: absolute; left: 64px; top: 1108px; width: 952px; height: 170px; z-index: 4;
    display: flex; align-items: center; justify-content: space-between; gap: 28px;
  }
  .foot-note {
    text-align: right;
    font-size: 20px; font-weight: 600; color: #c6a8ff;
  }
  .cta {
    color: #fff;
    background: linear-gradient(90deg, #4b17c9, #7b3bff);
    border-radius: 999px;
    display: inline-flex; align-items: center; gap: 16px;
    padding: 16px 18px 16px 32px;
    font-size: 26px; font-weight: 700;
    white-space: nowrap;
    box-shadow: 0 16px 34px #5a1edc80;
  }
  .cta-arr {
    background: #fff; border-radius: 50%;
    width: 44px; height: 44px;
    display: flex; justify-content: center; align-items: center;
  }
  .foot-right { display: flex; align-items: center; gap: 20px; }
  .qr-wrap {
    background: #fff; border-radius: 20px; padding: 10px;
    box-shadow: 0 16px 40px #00000055;
    width: 132px; height: 132px;
  }
  .qr-wrap img { width: 112px; height: 112px; display: block; }
  .foot-url {
    text-align: left;
  }
  .foot-url b { display: block; font-size: 24px; font-weight: 800; color: #fff; letter-spacing: -.3px; }
  .foot-url span { display: block; margin-top: 4px; font-size: 16px; font-weight: 500; color: #c6a8ff; }
</style>
</head>
<body>
<div id="card">
  <div class="bg" aria-hidden="true">
    <div class="grid"></div>
    <div class="sphere glass s1"></div>
    <div class="sphere s2"></div>
    <div class="sphere glass s3"></div>
    <div class="sphere s4"></div>
  </div>

  <div class="logo"><img src="assets/logo-white.png" alt="IDEEZA" /></div>
  <div class="pill"><span class="pill-dot"></span><span>VIRTUAL HACKATHON</span></div>

  <div class="hero">
    <div class="eyebrow"><span class="sq"></span>Total prizes</div>
    <div class="prize">160,000</div>
    <div class="prize-sub">1st 100K · 2nd 40K · 3rd 20K · grand prize over $1,000</div>
  </div>

  <div class="headline">
    <div class="h-thin">I'm</div>
    <div class="h-heavy">building.</div>
    <div class="h-sub">Vote for my project.</div>
  </div>

  <div class="photo">
    <div class="photo-ph">
      <div class="photo-lbl">PHOTO SLOT<small>Upload your photo here</small></div>
      <svg class="sil" viewBox="0 0 380 300">
        <defs>
          <linearGradient id="sil" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e2d4ff"/>
            <stop offset="1" stop-color="#9c7ae8"/>
          </linearGradient>
        </defs>
        <circle cx="190" cy="110" r="66" fill="url(#sil)" opacity=".85"/>
        <path d="M40 300 C 40 215, 110 185, 190 185 C 270 185, 340 215, 340 300 Z" fill="url(#sil)" opacity=".85"/>
      </svg>
    </div>
  </div>

  <div class="info">
    <div class="name">Your Name</div>
    <div class="proj">Project name — one-line pitch</div>
    <div class="rule"></div>
    <div class="chips">
      <div class="chip">70% public vote</div>
      <div class="chip">30% judges</div>
    </div>
    <div class="info-qr">
      <div class="qr-wrap"><img src="assets/qr-navy.png" alt="QR to ideeza.com" /></div>
      <div class="foot-url">
        <b>www.ideeza.com</b>
        <span>t.me/ideeza_chat</span>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="cta">
      Join at ideeza.com
      <span class="cta-arr">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M4 10h10M10 5l5 5-5 5" stroke="#5a1fe0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </div>
    <div class="foot-note">Share your link.</div>
  </div>
</div>
</body>
</html>
